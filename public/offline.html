<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - AmikomEventHub</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            text-align: center;
            padding: 24px;
        }
        .box { max-width: 360px; }
        .icon {
            width: 72px; height: 72px; margin: 0 auto 20px;
            background: #4f46e5; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 28px;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
        button {
            background: #4f46e5; color: white; border: none;
            padding: 12px 24px; border-radius: 12px; font-weight: 600;
            font-size: 14px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">AH</div>
        <h1>Koneksi Terputus</h1>
        <p>Sepertinya kamu sedang offline. Periksa koneksi internet kamu lalu coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
